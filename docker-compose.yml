services:
  backend:
    build: ./backend
    container_name: solace-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - TURN_HOST=${TURN_HOST:-localhost}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_USER=${TURN_USER:-solace}
      - TURN_PASSWORD=${TURN_PASSWORD:-changeme}
    volumes:
      - solace-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
    container_name: solace-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  coturn:
    image: coturn/coturn:4.6
    container_name: solace-turn
    restart: unless-stopped
    command: >
      -n --log-file=stdout
      --lt-cred-mech
      --realm=${TURN_REALM:-solace.local}
      --user=${TURN_USER:-solace}:${TURN_PASSWORD:-changeme}
      --fingerprint
      --no-tls
      --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

volumes:
  solace-uploads:
