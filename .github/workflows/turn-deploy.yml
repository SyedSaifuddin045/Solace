name: Deploy coturn TURN server to Coolify

on:
  workflow_dispatch:
  push:
    branches: [turn-deploy]

jobs:
  deploy-turn:
    runs-on: ubuntu-latest
    env:
      CF_BASE: ${{ secrets.COOLIFY_BASE_URL }}
      CF_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show env base (not secret value itself, just host)
        run: echo "coolify base = $CF_BASE"

      - name: API helper
        id: helper
        run: |
          cat > /tmp/cf.sh <<'EOF'
          set -euo pipefail
          API() {
            local m=$1 url=$2 data=${3:-}
            local tmp headers code body
            tmp=$(mktemp)
            if [ -n "$data" ]; then
              curl -sS -D "$tmp.h" -o "$tmp.b" -w "%{http_code}" -X "$m" "$CF_BASE$url" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$data" > "$tmp.c" 2>/dev/null || true
            else
              curl -sS -D "$tmp.h" -o "$tmp.b" -w "%{http_code}" -X "$m" "$CF_BASE$url" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Accept: application/json" > "$tmp.c" 2>/dev/null || true
            fi
            code=$(cat "$tmp.c")
            if [ "$code" -ge 400 ]; then
              echo "HTTP $code for $m $url" >&2
              head -30 "$tmp.h" >&2
              cat "$tmp.b" >&2
              return 1
            fi
            cat "$tmp.b"
          }
          EOF
          echo "helper written"

      - name: Probe Coolify (version, servers, projects)
        run: |
          source /tmp/cf.sh
          echo "--- version"
          echo "VERSION: $(API GET /api/v1/version || echo n/a)"
          echo "--- servers"
          API GET /api/v1/servers > /tmp/servers.json
          jq -r '.[] | "SERVER \(.uuid) \(.name) ip=\(.ip) \(.settings.is_reachable)"' /tmp/servers.json || cat /tmp/servers.json
          echo "--- backend app detail (source of project+env)"
          API GET /api/v1/applications/kk17nds0emb90iz9mce73c02 > /tmp/app-detail.json
          jq '{uuid, name, project_uuid, environment_name, git_repository, git_branch, build_pack}' /tmp/app-detail.json
          echo "--- existing apps (turn?)"
          API GET /api/v1/applications > /tmp/apps.json || true
          jq -r '.[] | "APP \(.uuid) \(.name) \(.status)"' /tmp/apps.json 2>/dev/null || echo "no apps list"

      - name: Discover API routes
        run: |
          source /tmp/cf.sh
          for p in "/api/v1/openapi" "/api/v1/openapi.json" "/api/docs" "/api/v1/applications/types"; do
            echo "=== $p ==="
            if API GET "$p" > /tmp/routes.json 2>/dev/null; then
              python3 -c "import json; d=json.load(open('/tmp/routes.json')); print('KEYS', list(d.keys())[:15] if isinstance(d,dict) else d); print('PATHS', ' '.join(sorted(d.get('paths',{}).keys())) if isinstance(d,dict) and 'paths' in d else '-')" 2>&1 || echo "(parse fail)"
            else
              echo "no (404/err)"
            fi
          done

      - name: Create coturn compose app (idempotent)
        run: |
          source /tmp/cf.sh
          SERVER_UUID=$(jq -r '.[0].uuid' /tmp/servers.json)
          API GET /api/v1/projects > /tmp/projects.json
          PROJECT_UUID=$(jq -r '.[] | select(.name=="Solace") | .uuid' /tmp/projects.json | head -1)
          API GET "/api/v1/projects/$PROJECT_UUID" > /tmp/project-detail.json 2>/dev/null || echo '{}' > /tmp/project-detail.json
          echo "project detail keys: $(jq -r 'keys|join(",")' /tmp/project-detail.json 2>/dev/null)"
          ENV_NAME=$(jq -r '.environments[0].name // empty' /tmp/project-detail.json)
          ENV_UUID=$(jq -r '.environments[0].uuid // empty' /tmp/project-detail.json)
          echo "server=$SERVER_UUID project=$PROJECT_UUID env=$ENV_NAME envUuid=$ENV_UUID"
          echo "projects: $(jq -r '[.[].name] | join(",")' /tmp/projects.json)"
          echo "environments: $(jq -r '[.environments[]?.name] | join(",")' /tmp/project-detail.json)"
          EXISTING=$(jq -r '.[] | select(.name=="solace-turn") | .uuid' /tmp/apps.json 2>/dev/null | head -1)
          ENV_NAME="${ENV_NAME:-production}"
          jq -n \
            --arg p "$PROJECT_UUID" --arg s "$SERVER_UUID" --arg e "$ENV_NAME" --arg eu "$ENV_UUID" \
            '{server_uuid:$s, project_uuid:$p, environment_name:$e, environment_uuid:$eu, name:"solace-turn", description:"coturn WebRTC relay", git_repository:"https://github.com/SyedSaifuddin045/Solace.git", git_branch:"turn-deploy", build_pack:"dockercompose", docker_compose_location:"/docker-compose.turn.yml", is_auto_deploy_enabled:false, instant_deploy:false}' > /tmp/body.json
          cat /tmp/body.json
          if [ -n "$EXISTING" ]; then
            echo "APP EXISTS uuid=$EXISTING (skip create)"
            echo "uuid=$EXISTING" >> "$GITHUB_ENV"
          else
            echo "creating app..."
            RESP=$(API POST /api/v1/applications/public "$(cat /tmp/body.json)")
            echo "$RESP"
            UUID=$(echo "$RESP" | jq -r '.uuid')
            echo "uuid=$UUID" >> "$GITHUB_ENV"
          fi

      - name: Deploy coturn
        run: |
          source /tmp/cf.sh
          echo "deploying uuid=${{ env.uuid }}"
          API POST /api/v1/deploy "{\"uuid\":\"${{ env.uuid }}\",\"force\":true}"

      - name: Deployment status
        run: |
          source /tmp/cf.sh
          ${{ env.uuid != '' && 'echo "uuid env present"' || 'echo "NO uuid env"' }}
          API GET "/api/v1/projects" > /dev/null
          for i in $(seq 1 18); do
            D=$(API GET "/api/v1/deployments/applications/${{ env.uuid }}" 2>/dev/null || echo '[]')
            ST=$(echo "$D" | jq -r 'sort_by(.created_at) | last | .status // "unknown"')
            echo "deployment status=$ST ($i)"
            [ "$ST" = "finished" ] || [ "$ST" = "failed" ] || [ "$ST" = "exited" ] || [ "$ST" = "success" ] && break
            sleep 10
          done
      - name: App logs (tail)
        if: always()
        run: |
          source /tmp/cf.sh
          API GET "/api/v1/applications/${{ env.uuid }}/logs?limit=30" 2>/dev/null | tail -c 3000 || echo "no logs endpoint"
      - name: External port check
        run: |
          # give the build/pull time; poll TCP 3478 from this external runner
          for i in $(seq 1 24); do
            sleep 10
            if timeout 5 bash -c "</dev/tcp/167.233.63.56/3478" 2>/dev/null; then
              echo "TCP 3478 OPEN after ~$((i*10))s"
              break
            fi
            echo "waiting... ($i)"
          done
          timeout 5 bash -c "</dev/tcp/167.233.63.56/3478" 2>/dev/null && echo "FINAL: tcp3478 OPEN" || echo "FINAL: tcp3478 CLOSED/TIMEOUT"
# registry-refresh

# sync
