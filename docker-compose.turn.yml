services:
  coturn:
    image: coturn/coturn:4.6
    container_name: solace-turn
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--realm=solace.local"
      - "--user=solace:solace"
      - "--fingerprint"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--min-port=50000"
      - "--max-port=50999"
      - "--stale-nonce=600"
      - "--log-binding"
      - "--external-ip=167.233.63.56"
      - "--no-cli"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50000-50999:50000-50999/udp"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 64